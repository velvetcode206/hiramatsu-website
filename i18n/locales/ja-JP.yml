pages:
  home:
    title: ホーム
    hero-title: 伝統、規律、実践。
    hero-body: 伝統、技術、個人の成長が出会う、日本の武道の研究と実践に特化したスペースです。
    school-title: 学校
    school-body: |-
      平松協会は、日本の武道伝統の研究、実践、保存に特化したスペースです。

      練習にはテクニックを学ぶだけでなく、注意、規律、敬意、一貫性が必要です。

      各トレーニングセッションは、動きを完璧にし、原則を理解し、自分の体や練習を共有する人々とのより意識的な関係を築く機会です。

      継続的な学習環境では、伝統と実践が結びついて、トレーニングの瞬間を超えた経験が形成されます。
    quote: 「痛みは避けられない。苦しみはオプションだ。」 — 村上春樹によって広められたフレーズ
    principles-title: テクニックを超えた練習
    principles-body: |-
      規律
      進化は規則性、注意力、そしてトレーニングへの献身から生まれます。

      尊重する
      学習は、伝統、インストラクター、実践者を尊重し、一緒に行われます。

      精度
      それぞれの動きを理解し完璧にするには、細部への注意が不可欠です。

      継続性
      ワークアウトごとに新しい体験が追加されます。学習は時間をかけて構築され、終点はありません。
    emotional-title: 変形を練習する
    emotional-body: |-
      学習は意図と実践が出会うことで起こります。

      あらゆる動きに存在感が必要です。繰り返すたびに新しい詳細が明らかになります。時間が経つにつれて、単なるテクニックのように見えたものが、実践に対するより深い理解の一部になります。

      トレーニングに次ぐトレーニングを積み重ねるこのプロセスにおいて、経験は意味を持ちます。
    cta-title: ひらまつを見つけに来てください
    cta-body: 私たちの学校、私たちの練習、そして私たちへの連絡方法について詳しくご覧ください。
